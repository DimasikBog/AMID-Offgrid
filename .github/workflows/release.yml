name: Signed Android candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-distribution
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require the reviewed main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 scripts/check_project.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency 2 --reporter expanded
      - run: python3 scripts/prepare_offline_payload.py
      - name: Build with the distribution key
        env:
          AMID_SIGNING: distribution
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/amid-release.jks
        run: |
          set -euo pipefail
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          keys = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing signing secrets: ' + ', '.join(missing))
          path = Path(os.environ['ANDROID_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True))
          path.chmod(0o600)
          PY
          flutter build apk --release --target-platform android-arm64
          python3 scripts/build_play_bundle.py
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AMID_Offgrid_distribution.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/AMID_Offgrid_distribution.aab
          python3 scripts/verify_apk.py dist/AMID_Offgrid_distribution.apk
          jarsigner -verify dist/AMID_Offgrid_distribution.aab
          python3 scripts/verify_play_bundle.py dist/AMID_Offgrid_distribution.aab
          python3 scripts/create_manifest.py --artifact dist/AMID_Offgrid_distribution.apk --artifact dist/AMID_Offgrid_distribution.aab --platform android --signing distribution --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --quality success --bundled-starter
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: AMID-Offgrid-Android-distribution-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
