name: Azimuth bench checks and package
on:
  pull_request:
    paths: ['hardware/azimuth/**', '.github/workflows/azimuth.yml']
  push:
    branches: [main]
    paths: ['hardware/azimuth/**', '.github/workflows/azimuth.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azimuth-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: hardware/azimuth
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  firmware-browser:
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hardware/azimuth
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_panel_browser.py
      - name: Host firmware logic
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I tests tests/test_firmware.cpp -o test_firmware
          ./test_firmware
      - run: python tools/download_avr.py
      - run: python tools/build_avr.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: AMID-Azimuth-v0.5.0
          path: hardware/azimuth/dist/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: firmware-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: AMID-Azimuth-v0.5.0
          path: azimuth-package
      - name: Publish the verified experimental package once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view azimuth-v0.5.0 > /dev/null 2>&1; then
            echo 'Version already published; existing release is preserved.'
          else
            gh release create azimuth-v0.5.0 azimuth-package/* --target "$GITHUB_SHA" --title 'AMID Azimuth 0.5.0 — experimental bench' --prerelease --notes-file hardware/azimuth/RELEASE_NOTES.md
          fi
