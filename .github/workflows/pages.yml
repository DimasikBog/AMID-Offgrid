name: Publish web app

on:
  push:
    branches: [main]
    paths: ['lib/**', 'assets/**', 'web/**', 'pubspec.*', 'scripts/build_web_cache.py', 'scripts/web_worker.js', 'scripts/test_web_offline.py', 'scripts/check_web_browser.py', 'scripts/requirements-web-checks.txt', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        id: pages
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: flutter pub get --enforce-lockfile
      - name: Build for the configured Pages path
        env:
          AMID_PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --no-pub --no-web-resources-cdn --base-href "${AMID_PAGES_BASE}/"
      - name: Record deployed source
        env:
          AMID_SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('build/web/source.json').write_text(json.dumps({'sourceCommit': os.environ['AMID_SOURCE_SHA'], 'physicalDeviceTested': False}))
          PY
          python3 scripts/build_web_cache.py build/web
      - name: Verify real browser before deploying
        run: |
          python3 -m venv "$RUNNER_TEMP/pwa-checks"
          "$RUNNER_TEMP/pwa-checks/bin/python" -m pip install -r scripts/requirements-web-checks.txt
          "$RUNNER_TEMP/pwa-checks/bin/python" -m playwright install --with-deps chromium --only-shell
          "$RUNNER_TEMP/pwa-checks/bin/python" scripts/check_web_browser.py build/web
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
