name: AMIDPocket
options:
  deploymentTarget:
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  AMIDPocket:
    type: application
    platform: watchOS
    sources:
      - path: AMIDPocket
      - path: ../wearables/cards.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amid.offgrid.watch
        MARKETING_VERSION: '0.5.0'
        CURRENT_PROJECT_VERSION: '7'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_CFBundleDisplayName: AMID Pocket
    scheme:
      testTargets: []
