<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120"><rect width="1440" height="1120" fill="#0c151e"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#dbe7ef;font-size:19px}.title{font-size:32px;font-weight:bold}.small{font-size:15px;fill:#a9bac8}.board{fill:#142737;stroke:#55758d;stroke-width:2}.wire{fill:none;stroke-width:4;stroke-linejoin:round}.port{fill:#0c151e;stroke:#bbd5e5;stroke-width:2}.label{font-size:16px}</style><text x="40" y="52" class="title">AMID AZIMUTH / NAMED-TERMINAL WIRING</text><text x="40" y="84" class="small">Not a PCB footprint. Board terminal labels take precedence over physical board orientation.</text><rect x="50" y="120" width="340" height="510" rx="12" class="board"/><text x="70" y="155" class="">ARDUINO MEGA 2560</text><rect x="830" y="120" width="420" height="330" rx="12" class="board"/><text x="850" y="155" class="">ULN2003 MOTOR BOARD</text><circle cx="390" cy="205" r="6" class="port"/><text x="300" y="211" class="label">D22</text><circle cx="830" cy="205" r="6" class="port"/><text x="844" y="211" class="label">IN1</text><path d="M396 205 H610.0 V205 H824" stroke="#66d9c5" class="wire"/><circle cx="390" cy="255" r="6" class="port"/><text x="300" y="261" class="label">D23</text><circle cx="830" cy="255" r="6" class="port"/><text x="844" y="261" class="label">IN2</text><path d="M396 255 H610.0 V255 H824" stroke="#e6cf68" class="wire"/><circle cx="390" cy="305" r="6" class="port"/><text x="300" y="311" class="label">D24</text><circle cx="830" cy="305" r="6" class="port"/><text x="844" y="311" class="label">IN3</text><path d="M396 305 H610.0 V305 H824" stroke="#b995f2" class="wire"/><circle cx="390" cy="355" r="6" class="port"/><text x="300" y="361" class="label">D25</text><circle cx="830" cy="355" r="6" class="port"/><text x="844" y="361" class="label">IN4</text><path d="M396 355 H610.0 V355 H824" stroke="#6cb7f4" class="wire"/><circle cx="390" cy="405" r="6" class="port"/><text x="300" y="411" class="label">D26</text><circle cx="390" cy="465" r="6" class="port"/><text x="300" y="471" class="label">D27</text><circle cx="390" cy="525" r="6" class="port"/><text x="300" y="531" class="label">D28</text><rect x="830" y="490" width="420" height="170" rx="12" class="board"/><text x="850" y="525" class="">NC SWITCH CIRCUITS</text><path d="M396 405 H720 V550 H824" stroke="#eea86d" class="wire"/><circle cx="830" cy="550" r="6" class="port"/><text x="844" y="556" class="label">LEFT NC</text><text x="1030" y="556" class="label">COM → GND</text><path d="M396 465 H650 V588 H824" stroke="#df85ad" class="wire"/><circle cx="830" cy="588" r="6" class="port"/><text x="844" y="594" class="label">RIGHT NC</text><text x="1030" y="594" class="label">COM → GND</text><path d="M396 525 H580 V626 H824" stroke="#fa7373" class="wire"/><circle cx="830" cy="626" r="6" class="port"/><text x="844" y="632" class="label">STOP NC</text><text x="1030" y="632" class="label">COM → GND</text><text x="850" y="432" class="small">Factory 5-pin motor socket → 28BYJ-48 5 V</text><text x="50" y="680" class="small">GND: Mega GND ↔ ULN2003 GND ↔ USB breakout GND ↔ all switch COM.</text><text x="50" y="709" class="small">NO contacts unused. INPUT_PULLUP: NC closed = 0, pressed / broken wire = 1.</text><rect x="50" y="750" width="340" height="140" rx="12" class="board"/><text x="70" y="785" class="">POWER BANK / USB-A</text><rect x="540" y="750" width="360" height="140" rx="12" class="board"/><text x="560" y="785" class="">USB BREAKOUT / 5 V</text><rect x="1050" y="750" width="340" height="140" rx="12" class="board"/><text x="1070" y="785" class="">ULN2003 POWER</text><path d="M396 810 H465.0 V810 H534" stroke="#fa7373" class="wire"/><path d="M906 810 H975.0 V810 H1044" stroke="#fa7373" class="wire"/><text x="70" y="850" class="small">5 V output; no 9/12 V trigger</text><text x="560" y="850" class="small">Verify voltage + polarity first</text><text x="1070" y="810" class="label">VCC / +5 V</text><text x="1070" y="850" class="small">GND → common GND</text><text x="50" y="935" class="small">DO NOT connect this motor +5 V rail to Mega +5 V while Mega is powered by laptop USB.</text><rect x="50" y="965" width="1340" height="110" rx="12" class="board"/><text x="70" y="1000" class="">LAPTOP: separate USB data cables → Mega USB-B and local Meshtastic USB-C</text><text x="70" y="1033" class="small">Local LoRa node → matched 868 MHz antenna via its verified RF port; remote own node → its 868 MHz antenna.</text><text x="50" y="1100" class="small">NC switch tests: motor power disconnected. No Mega GPIO connects directly to the 3.3 V radio board.</text><circle cx="390" cy="810" r="6" class="port"/><circle cx="540" cy="810" r="6" class="port"/><circle cx="900" cy="810" r="6" class="port"/><circle cx="1050" cy="810" r="6" class="port"/></svg>